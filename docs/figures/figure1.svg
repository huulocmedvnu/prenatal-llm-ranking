<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="960" height="420" fill="white"/><text x="20" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">Fetuses with a monogenic diagnosis</text><text x="345" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">Gene ranking from the same findings</text><text x="660" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">Analyses</text><line x1="325" y1="15" x2="325" y2="405" stroke="#bbb" stroke-width="1"/><line x1="640" y1="15" x2="640" y2="405" stroke="#bbb" stroke-width="1"/><rect x="20" y="50" width="290" height="150" rx="6" fill="#636EFA" fill-opacity="0.10" stroke="#636EFA" stroke-width="1.5"/><circle cx="45" cy="78" r="7" fill="#636EFA"/><ellipse cx="54" cy="89" rx="11" ry="8" fill="#636EFA"/><text x="75" y="85" font-family="Arial" font-size="13" font-weight="bold" fill="#636EFA" text-anchor="start">Reported before 1 July 2026</text><text x="35" y="112" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">3 cohorts (China, Austria, United Kingdom)</text><text x="35" y="134" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">299 fetuses, 735 findings</text><text x="35" y="156" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Largest cohort with variants: 185 fetuses</text><text x="35" y="185" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Used for period comparison</text><rect x="20" y="220" width="290" height="170" rx="6" fill="#EF553B" fill-opacity="0.10" stroke="#EF553B" stroke-width="1.5"/><circle cx="45" cy="248" r="7" fill="#EF553B"/><ellipse cx="54" cy="259" rx="11" ry="8" fill="#EF553B"/><text x="75" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#EF553B" text-anchor="start">Reported from 1 July 2026</text><text x="35" y="282" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">9 publications, 153 fetuses, 367 findings</text><text x="35" y="304" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Two independent extractions</text><text x="35" y="326" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">With reported variants: 66 fetuses</text><text x="35" y="355" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">After model training cutoffs</text><text x="35" y="375" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Primary analysis</text><rect x="345" y="50" width="280" height="150" rx="6" fill="#AB63FA" fill-opacity="0.10" stroke="#AB63FA" stroke-width="1.5"/><text x="360" y="78" font-family="Arial" font-size="13" font-weight="bold" fill="#AB63FA" text-anchor="start">Findings as text</text><text x="360" y="104" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Large language models</text><text x="360" y="126" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Claude Haiku, Sonnet and Opus 5.5</text><text x="360" y="148" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Four open-weight models, 8 to 20B</text><text x="360" y="178" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Top 50 genes as HGNC symbols</text><rect x="345" y="220" width="280" height="170" rx="6" fill="#00CC96" fill-opacity="0.10" stroke="#00CC96" stroke-width="1.5"/><text x="360" y="248" font-family="Arial" font-size="13" font-weight="bold" fill="#00936b" text-anchor="start">Findings as HPO terms</text><text x="360" y="274" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Exomiser 15.1.0, phenotype only</text><text x="360" y="296" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">hiPHIVE and human-only</text><text x="360" y="318" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">HPO semantic similarity</text><text x="360" y="340" font-family="Arial" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">(Resnik, 4,354 genes)</text><text x="360" y="370" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Ranked gene lists</text><line x1="312" y1="125" x2="342" y2="125" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/><line x1="312" y1="305" x2="342" y2="305" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/><rect x="660" y="50" width="280" height="58" rx="6" fill="#555555" fill-opacity="0.10" stroke="#555555" stroke-width="1.5"/><text x="675" y="74" font-family="Arial" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Primary</text><text x="675" y="95" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Top 10 in fetuses from 1 July 2026</text><rect x="660" y="120" width="280" height="58" rx="6" fill="#555555" fill-opacity="0.10" stroke="#555555" stroke-width="1.5"/><text x="675" y="144" font-family="Arial" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Period comparison</text><text x="675" y="165" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Adjusted and propensity-matched</text><rect x="660" y="190" width="280" height="58" rx="6" fill="#555555" fill-opacity="0.10" stroke="#555555" stroke-width="1.5"/><text x="675" y="214" font-family="Arial" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Robustness</text><text x="675" y="235" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Recall probe, shuffled findings, rewording</text><rect x="660" y="260" width="280" height="58" rx="6" fill="#555555" fill-opacity="0.10" stroke="#555555" stroke-width="1.5"/><text x="675" y="284" font-family="Arial" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Retrieval</text><text x="675" y="305" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Similar cases or Exomiser candidates</text><rect x="660" y="330" width="280" height="58" rx="6" fill="#555555" fill-opacity="0.10" stroke="#555555" stroke-width="1.5"/><text x="675" y="354" font-family="Arial" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Clinical simulation</text><text x="675" y="375" font-family="Arial" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Variants in benchmark exomes, Exomiser</text><line x1="627" y1="200" x2="657" y2="200" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/></svg>